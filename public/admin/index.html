  <!-- 헬베티카(Helvetica)와 가장 잘 어울리는 한글 네오-그로테스크 산세리프 Pretendard 로드 -->
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />

    :root {
      --bg-paper: #F5EFE7;
      --bg-card: #FFFFFF;
      --text-ink: #181818;
      --text-muted: #66635E;
      --border-color: #D5CEC2;
      --accent: #181818;
      --highlight: #8C6239;
      --font-helvetica: "Helvetica Neue", Helvetica, "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;

    body {
      font-family: var(--font-helvetica);
      background-color: var(--bg-paper);
      color: var(--text-ink);
      font-size: 18px;
      line-height: 1.5;
      letter-spacing: -0.015em;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* 상단 헤더 */
    header {
      background-color: var(--accent);
      color: var(--bg-paper);
      padding: 16px 28px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #000;
      flex-shrink: 0;
    }

    header h1 {
      font-size: 21px;
      font-weight: 700;
      letter-spacing: -0.03em;
    }

    header span {
      font-size: 15px;
      font-weight: 500;
      color: #B8B2A8;
    }

    /* 메인 2단 레이아웃 */
    .workspace {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    .map-pane {
