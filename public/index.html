<style>
[hidden]{display:none!important}
:root{color-scheme:only light;--paper:#F5EFE7;--paper-2:#EBE3D7;--ink:#24211D;--ink-2:#625C53;--ink-3:#9A9286;--rule:#D7CDBF;--accent:#8A4B2D;--me:#3D6E9E;--lift:0 1px 0 rgba(36,33,29,.05),0 14px 34px -12px rgba(36,33,29,.30);--serif:"Noto Serif KR","Noto Serif CJK KR","Nanum Myeongjo","AppleMyungjo","Batang",ui-serif,serif}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--serif);font-size:15px;line-height:1.6;overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#map{position:fixed;inset:0;background:var(--paper-2)}
.bar{position:fixed;z-index:20;top:0;left:0;right:0;padding:calc(10px + env(safe-area-inset-top,0px)) 14px 10px;background:none;pointer-events:none}
.bar>*{pointer-events:auto}.brand{display:inline-flex;align-items:baseline;gap:8px;margin:0 0 8px;padding:5px 14px;border-radius:999px;background:color-mix(in srgb,var(--paper) 88%,transparent);box-shadow:var(--lift);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}.brand h1{margin:0;font-size:17px;font-weight:700;letter-spacing:-.01em}.brand span{font-size:12px;color:var(--ink-3)}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px 2px 14px;margin-bottom:-10px}.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--rule);background:var(--paper);border-radius:999px;padding:5px 13px;font-size:13px;color:var(--ink-2);box-shadow:var(--lift)}
.chip[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.tools{position:fixed;z-index:20;right:14px;bottom:calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px;transition:bottom .2s}
body.has-sheet .tools{bottom:calc(var(--sheet-h,0px) + 18px)}
.tool{width:46px;height:46px;border-radius:50%;border:1px solid var(--rule);background:var(--paper);box-shadow:var(--lift);display:grid;place-items:center;font-size:11px;padding:0}
.tool svg{width:22px;height:22px;stroke:var(--ink);fill:none;stroke-width:1.7}.tool.on{border-color:var(--me);box-shadow:0 0 0 2px var(--me)}.tool.busy{opacity:.6}
.pin{display:block;border:0;padding:0;background:none;position:relative;width:40px;height:48px;isolation:isolate;--c:var(--ink)}
.pin .bd{display:grid;place-items:center;width:40px;height:40px;border-radius:50%;background:var(--paper);border:2px solid var(--c);color:var(--c);box-shadow:0 2px 6px rgba(36,33,29,.3)}
.pin::after{content:"";position:absolute;left:50%;bottom:3px;width:12px;height:12px;background:var(--paper);border-right:2px solid var(--c);border-bottom:2px solid var(--c);transform:translateX(-50%) rotate(45deg);z-index:-1}
.pin.course{--c:var(--ink)}.pin.planned{--c:#9A9286}.pin.cafe{--c:#8A4B2D}.pin.food{--c:#A8742F}.pin.park{--c:#6B7F4E}.pin.facility{--c:#3D6E9E}.pin.etc{--c:#6B7F4E}
.pin.planned .bd{border-style:dashed}
.pin.sel{transform:scale(1.18);transform-origin:50% 100%}
.pin.sel .bd{background:var(--c);color:var(--paper)}.pin.sel::after{background:var(--c)}
.chip{display:inline-flex;align-items:center;gap:6px}.chip svg{flex:none}
.me-dot{width:18px;height:18px;border-radius:50%;background:var(--me);border:3px solid #fff;box-shadow:0 0 0 0 rgba(61,110,158,.5);animation:pulse 2s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 14px rgba(61,110,158,0)}100%{box-shadow:0 0 0 0 rgba(61,110,158,0)}}
.sheet{position:fixed;z-index:30;left:0;right:0;bottom:0;max-height:75vh;overflow:auto;background:var(--paper);border-top:1px solid var(--rule);border-radius:18px 18px 0 0;box-shadow:var(--lift);padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px))}
@media (min-width:900px){.sheet{left:auto;top:0;width:400px;max-height:none;border-radius:0;border-top:0;border-left:1px solid var(--rule);padding-top:24px}body.has-sheet .tools{bottom:18px;right:418px}}
.sheet .x{position:absolute;top:10px;right:12px;border:0;background:none;font-size:22px;color:var(--ink-3);width:36px;height:36px}
.sheet-img{width:100%;height:220px;object-fit:cover;border-radius:10px;margin-bottom:12px;border:1px solid var(--rule)}
.kicker{margin:0 0 2px;font-size:12px;color:var(--accent);font-weight:700;letter-spacing:.02em}
.sheet h2{margin:0 36px 4px 0;font-size:21px;line-height:1.3;letter-spacing:-.01em}.meta{margin:0 0 14px;color:var(--ink-2);font-size:13px}
dl{margin:0 0 16px;display:grid;grid-template-columns:5.2em 1fr;gap:8px 10px;font-size:14px}dt{color:var(--ink-3)}dd{margin:0}
.tip-box{background:var(--paper-2);border-left:3px solid var(--accent);padding:10px 12px;border-radius:0 8px 8px 0;font-size:14px;margin-bottom:14px}
.tip-box strong{color:var(--accent);display:block;margin-bottom:2px;font-size:13px}
.note{font-size:13px;color:var(--ink-2);border-top:1px solid var(--rule);padding-top:12px;margin:14px 0;white-space:pre-line}
.btn{border:1px solid var(--ink);background:var(--paper);border-radius:10px;padding:11px 16px;font-size:15px;margin-bottom:8px;display:block;text-align:center;text-decoration:none}
.btn.solid{background:var(--ink);color:var(--paper);width:100%;font-weight:700}
.btn.insta{background:var(--paper);border-color:var(--accent);color:var(--accent);width:100%;font-weight:700}
.dim{position:fixed;inset:0;z-index:40;background:rgba(20,18,15,.45);display:flex;align-items:flex-end;justify-content:center}
.pick{width:100%;max-width:440px;background:var(--paper);border-radius:18px 18px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));box-shadow:var(--lift)}
@media (min-width:600px){.dim{align-items:center}.pick{border-radius:18px}}
.pick h3{margin:0 0 2px;font-size:17px}.pick p{margin:0 0 12px;color:var(--ink-2);font-size:13px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--paper-2);border-radius:10px;padding:3px;margin-bottom:12px}
.seg button{border:0;background:none;border-radius:8px;padding:7px;font-size:14px;color:var(--ink-2)}.seg button[aria-pressed=true]{background:var(--paper);color:var(--ink);font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.apps{display:grid;gap:8px;margin-bottom:10px}.apps button{display:flex;justify-content:space-between;align-items:center;border:1px solid var(--rule);background:var(--paper);border-radius:12px;padding:13px 16px;font-size:16px}.apps small{color:var(--ink-3);font-size:12px}
.cancel{width:100%;border:0;background:none;padding:10px;color:var(--ink-2)}
.toast{position:fixed;z-index:50;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);max-width:90vw;background:var(--ink);color:var(--paper);padding:9px 16px;border-radius:999px;font-size:13px;box-shadow:var(--lift)}
.fail{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:24px;background:var(--paper)}.fail div{max-width:460px}.fail h2{margin:0 0 8px;font-size:19px}
/* 카카오 지도 색 입히기 시험: 지도 바탕만 종이색으로 물들인다. 주소 끝에 ?tone=off 를 붙이면 끈다 */
body:not(.tone-off) #map{filter:sepia(.42) saturate(.72) contrast(1) brightness(1.02)}
</style>
</head>
<body>
<script>if(/[?&]tone=off/.test(location.search))document.body.classList.add('tone-off')</script>
<div id="map" aria-label="산책 코스 지도"></div>
<header class="bar">
  <div class="brand"><h1>일,요사진이 걸어본 길</h1><span>직접 걸어본 길만</span></div>
  <div class="chips" id="chips" role="group" aria-label="보기 거르기"></div>
</header>
<div class="tools">
  <button class="tool" id="btn-gpx" title="GPX 불러오기"><span>GPX</span></button>
  <button class="tool" id="btn-locate" aria-pressed="false" title="내 위치">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><circle cx="12" cy="12" r="7.5"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>
  </button>
</div>
<input id="gpx-input" type="file" hidden>
<aside class="sheet" id="sheet" hidden></aside>
<div class="toast" id="toast" hidden role="status"></div>
<script>
const KAKAO_KEY='b0e252133176935cb1595de547a315b0', APP_NAME='thisisnotawalk.com', INSTA='https://www.instagram.com/sun.dayphoto/';
const SAMPLE_ROUTE=[[37.661,126.7748],[37.66098,126.77507],[37.66097,126.77535],[37.66098,126.77563],[37.66104,126.77589],[37.66114,126.77613],[37.66129,126.77633],[37.66147,126.77649],[37.66166,126.77662],[37.66185,126.77672],[37.662,126.77683],[37.66213,126.77695],[37.66223,126.77711],[37.66232,126.77729],[37.6624,126.77749],[37.66249,126.7777],[37.66259,126.77789],[37.66271,126.77806],[37.66284,126.77822],[37.66298,126.77837],[37.66312,126.77852],[37.66328,126.77868],[37.66344,126.77886],[37.66361,126.77902],[37.6638,126.77915],[37.664,126.77922],[37.66419,126.77921],[37.66438,126.77912],[37.66456,126.77896],[37.66471,126.77876],[37.66485,126.77854],[37.66498,126.77833],[37.66512,126.77816],[37.66525,126.77801],[37.6654,126.77787],[37.66555,126.77774],[37.66569,126.77758],[37.66581,126.77739],[37.6659,126.77717],[37.66596,126.77692],[37.666,126.77667],[37.66603,126.77642],[37.66607,126.77618],[37.66611,126.77595],[37.66616,126.77573],[37.66621,126.77551],[37.66625,126.77528],[37.66627,126.77504],[37.66627,126.7748],[37.66623,126.77457],[37.66619,126.77434],[37.66615,126.77411],[37.66613,126.77388],[37.66613,126.77363],[37.66616,126.77336],[37.6662,126.77306],[37.66623,126.77274],[37.66623,126.77241],[37.66618,126.77211],[37.66609,126.77184],[37.66596,126.77162],[37.66579,126.77146],[37.6656,126.77134],[37.66541,126.77125],[37.66522,126.77117],[37.66504,126.7711],[37.66485,126.77105],[37.66467,126.77102],[37.66449,126.77103],[37.6643,126.77107],[37.66413,126.77116],[37.66396,126.77128],[37.6638,126.77139],[37.66365,126.77147],[37.66351,126.77152],[37.66336,126.77151],[37.66319,126.77147],[37.66302,126.77141],[37.66284,126.77137],[37.66265,126.77137],[37.66248,126.77144],[37.66233,126.77156],[37.66219,126.77172],[37.66207,126.7719],[37.66196,126.77209],[37.66184,126.77227],[37.66172,126.77244],[37.66158,126.77261],[37.66144,126.77279],[37.66131,126.77299],[37.6612,126.77321],[37.66112,126.77346],[37.66107,126.77372],[37.66105,126.77399],[37.66103,126.77426],[37.66102,126.77453],[37.661,126.7748]];
const COURSES=[
  {id:'jeongbalsan',kind:'course',status:'walked',name:'정발산 둘레 흙길',area:'고양시 일산동구 마두동',start:{name:'정발산공원 공영주차장',lat:SAMPLE_ROUTE[0][0],lng:SAMPLE_ROUTE[0][1]},km:2.1,min:40,condition:'흙길 80%, 야자매트 20%',size:'모든 견종',date:'2026.10.13 · 일로, 요이',note:'평일 오전은 한적합니다.',route:SAMPLE_ROUTE}
];
const SPOTS=[];
const KINDS={course:'산책 코스',park:'공원 · 운동장',cafe:'카페',food:'식당',facility:'편의시설',etc:'기타'};
const IC={
course:'<path d="M6 18c6 0 0-7 6-7s6-5 6-5"/><circle cx="6" cy="18" r="1.4" fill="currentColor"/><circle cx="18" cy="6" r="1.8"/>',
planned:'<path d="M6 18c6 0 0-7 6-7s6-5 6-5" stroke-dasharray="2 2.6"/><circle cx="18" cy="6" r="1.8" stroke-dasharray="2 2"/>',
cafe:'<path d="M5.5 9h10v5a4 4 0 0 1-4 4h-2a4 4 0 0 1-4-4z"/><path d="M15.5 10.5h1.2a2 2 0 0 1 0 4h-1.2"/><path d="M9 3.5c-.9 1 .9 1.6 0 2.7M12.2 3.5c-.9 1 .9 1.6 0 2.7"/>',
food:'<path d="M6 4v5a2 2 0 0 0 4 0V4M8 4v16"/><path d="M16.5 20V4c-2 1.4-3.3 4-3.3 7h3.3"/>',
park:'<path d="M12 20v-5"/><path d="M12 4c-3.5 0-5.6 3-5 5.4-1.5 1-2 3.6.6 5.1 1.2.7 2.7.5 4.4.5s3.2.2 4.4-.5c2.6-1.5 2.1-4.1.6-5.1.6-2.4-1.5-5.4-5-5.4z"/>',
facility:'<path d="M5 11h14M6.5 11V8a1 1 0 0 1 1-1h9a1 1 0 0 1 1 1v3M7.5 11v6M16.5 11v6M5 14.5h14"/>',
etc:'<circle cx="6.5" cy="10.5" r="1.7"/><circle cx="10" cy="6.5" r="1.7"/><circle cx="14" cy="6.5" r="1.7"/><circle cx="17.5" cy="10.5" r="1.7"/><path d="M12 12.5c-2.8 0-5 2.5-4.4 4.8.4 1.5 1.8 1.7 4.4 1.7s4-.2 4.4-1.7c.6-2.3-1.6-4.8-4.4-4.8z"/>'};
const svgIcon=(k,s)=>IC[k]?`<svg viewBox="0 0 24 24" width="${s}" height="${s}" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${IC[k]}</svg>`:'';
const FILTERS=[['all','전체'],['course','산책 코스'],['park','공원'],['cafe','카페'],['food','식당'],['facility','편의시설']];
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const isMobile=/Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
const narrow=()=>matchMedia('(min-width:900px)').matches===false;
let toastTimer;
function toast(msg,ms){const t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>{t.hidden=true},ms||2600);}
const KM=(a,b)=>{const R=6371,r=Math.PI/180,dA=(b[0]-a[0])*r,dO=(b[1]-a[1])*r;const h=Math.sin(dA/2)**2+Math.cos(a[0]*r)*Math.cos(b[0]*r)*Math.sin(dO/2)**2;return 2*R*Math.asin(Math.sqrt(h));};
const pathKm=p=>p.reduce((s,q,i)=>i?s+KM(p[i-1],q):0,0);

function showFail(reason){
  const f=document.createElement('div');f.className='fail';
  f.innerHTML=`<div><h2>카카오 지도를 불러오지 못했습니다</h2><p>${esc(reason)}</p></div>`;
  document.body.appendChild(f);
}
function loadKakao(){
  return new Promise((resolve,reject)=>{
    if(window.kakao&&kakao.maps&&kakao.maps.load)return kakao.maps.load(resolve);
    const s=document.createElement('script');
    s.src='https://dapi.kakao.com/v2/maps/sdk.js?appkey='+encodeURIComponent(KAKAO_KEY)+'&autoload=false';
    const timer=setTimeout(()=>reject(new Error('시간 초과')),10000);
    s.onload=()=>{clearTimeout(timer);(window.kakao&&kakao.maps&&kakao.maps.load)?kakao.maps.load(resolve):reject(new Error('SDK 오류'));};
    s.onerror=()=>{clearTimeout(timer);reject(new Error('SDK 로드 실패'));};
    document.head.appendChild(s);
  });
}

fetch('/data/places.json?t='+Date.now()).then(r=>r.ok?r.json():[]).catch(()=>[]).then(list=>{
  if(Array.isArray(list)) list.slice().reverse().forEach(d=>{
    const k={course:'course',cafe:'cafe',restaurant:'food',park:'park',facility:'facility'}[d.type]||'etc';
    const rt=d.path&&d.path.length>1?d.path:null, km=rt?Number(pathKm(rt).toFixed(1)):0;
    if(k==='course') COURSES.unshift({id:d.id,kind:'course',status:'walked',name:d.name,area:d.region,start:{name:d.name,lat:rt?rt[0][0]:d.lat,lng:rt?rt[0][1]:d.lng},at:[d.lat,d.lng],km,min:Math.round(km*18)||20,condition:d.condition,size:d.size,date:d.date,photo:d.photo,photoTip:d.photoTip,instaUrl:d.instaUrl,note:d.note,route:rt});
    else SPOTS.unshift({id:d.id,kind:k,name:d.name,area:d.region,at:[d.lat,d.lng],rule:d.condition,size:d.size,date:d.date,photo:d.photo,photoTip:d.photoTip,instaUrl:d.instaUrl,note:d.note});
  });
  return loadKakao();
}).then(start).catch(e=>showFail(e.message||String(e)));

function start(){
  const K=kakao.maps, ll=(la,lo)=>new K.LatLng(la,lo);
  const map=new K.Map($('#map'),{center:ll(37.6640,126.7500),level:8});
  if(!narrow())map.addControl(new K.ZoomControl(),K.ControlPosition.RIGHT);
  let filter='all',selected=null,gpxLine=null,gpxCase=null,routeLines=[];
  const items=[...COURSES,...SPOTS], pins=new Map();

  items.forEach(it=>{
    const pos=it.at||[it.start.lat,it.start.lng];
    const b=document.createElement('button');
    b.className='pin '+(it.kind==='course'?(it.status==='walked'?'course':'planned'):it.kind);
    b.setAttribute('aria-label',it.name);b.innerHTML='<span class="bd">'+svgIcon(it.kind==='course'&&it.status!=='walked'?'planned':it.kind,24)+'</span>';
    b.addEventListener('click',e=>{e.stopPropagation();select(it.id);});
    const ov=new K.CustomOverlay({position:ll(pos[0],pos[1]),content:b,yAnchor:1,zIndex:it.status==='walked'?3:2,clickable:true});
    pins.set(it.id,{it,ov,el:b,pos});
  });

  COURSES.filter(c=>c.route).forEach(c=>{
    const path=c.route.map(p=>ll(p[0],p[1]));
    const under=new K.Polyline({path,strokeWeight:9,strokeColor:'#FFFFFF',strokeOpacity:.9,strokeStyle:'solid'});
    const line=new K.Polyline({path,strokeWeight:5,strokeColor:'#24211D',strokeOpacity:1,strokeStyle:'solid'});
    routeLines.push({id:c.id,lines:[under,line]});
  });

  const chips=$('#chips');
  chips.innerHTML=FILTERS.map(([k,t])=>`<button class="chip" data-k="${k}" aria-pressed="${k===filter}">${svgIcon(k,16)}${t}</button>`).join('');
  chips.addEventListener('click',e=>{
    const b=e.target.closest('.chip');if(!b)return;
    filter=b.dataset.k;
    chips.querySelectorAll('.chip').forEach(x=>x.setAttribute('aria-pressed',String(x.dataset.k===filter)));
    deselect();render();
  });
  const visible=it=>filter==='all'||it.kind===filter;
  function render(){
    pins.forEach(({it,ov})=>ov.setMap(visible(it)?map:null));
    routeLines.forEach(r=>r.lines.forEach(l=>l.setMap(visible(COURSES.find(c=>c.id===r.id))?map:null)));
  }
  render();

  function select(id){
    const p=pins.get(id);if(!p)return;
    deselect(true);selected=id;p.el.classList.add('sel');openSheet(p.it);
    if(p.it.route){const b=new K.LatLngBounds();p.it.route.forEach(q=>b.extend(ll(q[0],q[1])));map.setBounds(b,90,40,narrow()?340:40,40);}
    else map.panTo(ll(p.pos[0],p.pos[1]));
  }
  function deselect(keep){if(selected){const p=pins.get(selected);p&&p.el.classList.remove('sel');selected=null;}if(!keep)closeSheet();}
  K.event.addListener(map,'click',()=>deselect());

  const sheet=$('#sheet');
  const row=(t,v)=>v?`<dt>${t}</dt><dd>${esc(v)}</dd>`:'';
  function openSheet(it){
    let h=`<button class="x" data-act="close" aria-label="닫기">×</button>`;
    if(it.photo) h+=`<img src="${esc(it.photo)}" class="sheet-img" alt="${esc(it.name)} 대표 사진">`;
    if(it.kind==='course'){
      h+=`<p class="kicker">${it.status==='walked'?'걸어본 길':'걸어볼 길'}</p><h2>${esc(it.name)}</h2>`;
      if(it.status==='walked'){
        h+=`<p class="meta">${esc(it.area)}${it.km?` · ${it.km}km · 약 ${it.min}분`:''}</p>`;
        if(it.photoTip) h+=`<div class="tip-box"><strong>사진 포인트 / 촬영 팁</strong>${esc(it.photoTip)}</div>`;
        h+=`<dl>${row('특징/노면',it.condition)}${row('권장 크기',it.size)}${row('걸은 날',it.date)}</dl>
        <button class="btn solid" data-act="nav">길 안내 (출발점)</button>`;
        if(it.instaUrl) h+=`<a href="${esc(it.instaUrl)}" target="_blank" rel="noopener" class="btn insta">이 곳의 더 많은 사진·영상 보기 (인스타그램)</a>`;
        else h+=`<a href="${INSTA}" target="_blank" rel="noopener" class="btn insta">일,요사진 인스타그램 보러가기</a>`;
        if(it.note) h+=`<div class="note">${esc(it.note)}</div>`;
      }else{
        h+=`<p class="meta">${esc(it.area)}</p><p class="one">아직 걸어보지 못한 길입니다.</p>`;
      }
    }else{
      h+=`<p class="kicker">반려견 동반 · ${esc(KINDS[it.kind])}</p><h2>${esc(it.name)}</h2><p class="meta">${esc(it.area)}</p>`;
      if(it.photoTip) h+=`<div class="tip-box"><strong>사진 포인트 / 촬영 팁</strong>${esc(it.photoTip)}</div>`;
      h+=`<dl>${row('동반 조건',it.rule)}${row('크기 제한',it.size)}${row('방문일',it.date)}</dl>
      <button class="btn solid" data-act="nav">길 안내</button>`;
      if(it.instaUrl) h+=`<a href="${esc(it.instaUrl)}" target="_blank" rel="noopener" class="btn insta">이 곳의 더 많은 사진·영상 보기 (인스타그램)</a>`;
      else h+=`<a href="${INSTA}" target="_blank" rel="noopener" class="btn insta">일,요사진 인스타그램 보러가기</a>`;
      if(it.note) h+=`<div class="note">${esc(it.note)}</div>`;
    }
    sheet.innerHTML=h;sheet.hidden=false;document.body.classList.add('has-sheet');
    document.documentElement.style.setProperty('--sheet-h',narrow()?Math.min(sheet.offsetHeight,innerHeight*.7)+'px':'0px');
    sheet.scrollTop=0;
  }
  function closeSheet(){sheet.hidden=true;document.body.classList.remove('has-sheet');}
  sheet.addEventListener('click',e=>{
    const a=e.target.closest('[data-act]');if(!a)return;
    if(a.dataset.act==='close')deselect();
    if(a.dataset.act==='nav'){const p=pins.get(selected);if(p)pickNav(p.it);}
  });

  const navTarget=it=>it.start?{name:it.start.name,lat:it.start.lat,lng:it.start.lng}:{name:it.name,lat:it.at[0],lng:it.at[1]};
  function openApp(appUrl,webUrl){
    if(!isMobile){if(webUrl)window.open(webUrl,'_blank','noopener');else toast('휴대폰에서만 열립니다.');return;}
    let left=false;const onHide=()=>{if(document.hidden)left=true;};
    document.addEventListener('visibilitychange',onHide);location.href=appUrl;
    setTimeout(()=>{document.removeEventListener('visibilitychange',onHide);if(!left&&webUrl)location.href=webUrl;else if(!left)toast('앱이 설치되어 있지 않습니다.');},1400);
  }
  const APPS={
    naver:(t,m)=>({app:`nmap://route/${m==='walk'?'walk':'car'}?dlat=${t.lat}&dlng=${t.lng}&dname=${encodeURIComponent(t.name)}&appname=${encodeURIComponent(APP_NAME)}`,web:`https://map.naver.com/p/directions/-/${t.lng},${t.lat},${encodeURIComponent(t.name)}/-/${m==='walk'?'walk':'car'}`}),
    kakao:(t,m)=>({app:`kakaomap://route?ep=${t.lat},${t.lng}&by=${m==='walk'?'FOOT':'CAR'}`,web:`https://map.kakao.com/link/to/${encodeURIComponent(t.name.replace(/,/g,' '))},${t.lat},${t.lng}`}),
    tmap:t=>({app:`tmap://route?goalname=${encodeURIComponent(t.name)}&goalx=${t.lng}&goaly=${t.lat}`,web:null})
  };
  function pickNav(it){
    const t=navTarget(it);let mode='car';
    const dim=document.createElement('div');dim.className='dim';
    dim.innerHTML=`<div class="pick" role="dialog" aria-modal="true"><h3>어느 앱으로 길을 찾을까요?</h3><p>${esc(t.name)}</p>
      <div class="seg"><button data-m="car" aria-pressed="true">자동차</button><button data-m="walk" aria-pressed="false">도보</button></div>
      <div class="apps"><button data-app="naver">네이버 지도 <small>앱 · 웹</small></button><button data-app="kakao">카카오맵 <small>앱 · 웹</small></button><button data-app="tmap">티맵 <small>휴대폰 앱</small></button></div>
      <button class="cancel">닫기</button></div>`;
    const close=()=>dim.remove();
    dim.addEventListener('click',e=>{
      if(e.target===dim||e.target.classList.contains('cancel'))return close();
      const m=e.target.closest('[data-m]');
      if(m){mode=m.dataset.m;dim.querySelectorAll('[data-m]').forEach(x=>x.setAttribute('aria-pressed',String(x===m)));return;}
      const a=e.target.closest('[data-app]');
      if(a){const u=APPS[a.dataset.app](t,mode);close();openApp(u.app,u.web);}
    });
    document.body.appendChild(dim);
  }

  const btnLoc=$('#btn-locate');let meOv=null,watchId=null;
  const setLoc=s=>{btnLoc.classList.toggle('busy',s==='busy');btnLoc.classList.toggle('on',s==='on');btnLoc.setAttribute('aria-pressed',String(s==='on'));};
  function stopLoc(){if(watchId!=null){navigator.geolocation.clearWatch(watchId);watchId=null;}if(meOv){meOv.setMap(null);meOv=null;}setLoc('off');}
  btnLoc.addEventListener('click',()=>{
    if(watchId!=null){stopLoc();toast('내 위치를 껐습니다.');return;}
    if(!navigator.geolocation){toast('위치를 지원하지 않습니다.');return;}
    setLoc('busy');let first=true;
    watchId=navigator.geolocation.watchPosition(pos=>{
      const p=ll(pos.coords.latitude,pos.coords.longitude);
      if(!meOv){const d=document.createElement('div');d.className='me-dot';meOv=new K.CustomOverlay({position:p,content:d,yAnchor:.5,xAnchor:.5,zIndex:9});meOv.setMap(map);}
      else meOv.setPosition(p);
      setLoc('on');if(first){first=false;map.setLevel(4);map.panTo(p);}
    },()=>{stopLoc();toast('위치 권한을 확인해 주세요.');},{enableHighAccuracy:true,maximumAge:5000,timeout:15000});
  });

  function parseGPX(text){
    const doc=new DOMParser().parseFromString(text,'application/xml');
    let nodes=[...doc.getElementsByTagNameNS('*','trkpt')];if(!nodes.length)nodes=[...doc.getElementsByTagNameNS('*','rtept')];
    const pts=nodes.map(n=>[parseFloat(n.getAttribute('lat')),parseFloat(n.getAttribute('lon'))]).filter(([a,b])=>isFinite(a)&&isFinite(b));
    if(pts.length<2)throw new Error('GPX 경로 없음');return pts;
  }
  function showGPX(pts,name){
    if(gpxLine){gpxLine.setMap(null);gpxCase.setMap(null);}
    const path=pts.map(p=>ll(p[0],p[1]));
    gpxCase=new K.Polyline({path,strokeWeight:9,strokeColor:'#FFFFFF',strokeOpacity:.9});
    gpxLine=new K.Polyline({path,strokeWeight:5,strokeColor:'#8A4B2D',strokeOpacity:1});
    gpxCase.setMap(map);gpxLine.setMap(map);
    const b=new K.LatLngBounds();path.forEach(q=>b.extend(q));map.setBounds(b,90,40,40,40);
    toast(`${name.replace(/\.gpx$/i,'')} · ${pathKm(pts).toFixed(1)}km`,4000);
  }
  const input=$('#gpx-input');
  $('#btn-gpx').addEventListener('click',()=>input.click());
  input.addEventListener('change',()=>{
    const f=input.files&&input.files[0];input.value='';if(!f)return;
    const r=new FileReader();
    r.onload=()=>{try{showGPX(parseGPX(String(r.result)),f.name);}catch(e){toast('GPX 읽기 실패');}};
    r.readAsText(f);
  });
}
</script>
</body>
</html>
