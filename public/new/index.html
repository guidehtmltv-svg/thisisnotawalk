<style>
:root{
  /* Layout: a paper 약도 fills the screen. Title bar on top, legend plaque bottom-left,
     course card = bottom sheet on phones / right-hand panel on desktop,
     course page slides over the map as one reading column. */
  --paper:#F5EFE7;      /* 일,요 종이색 */
  --me:#3D6E9E;         /* 내 위치 */
  --paper-2:#EBE3D7;    /* 바깥 지역, 사진 자리 */
  --water:#DDD9D1;      /* 한강·바다 */
  --ink:#24211D;        /* 먹 */
  --ink-2:#625C53;      /* 보조 글자 */
  --ink-3:#9A9286;      /* 지명, 빈칸 */
  --rule:#D7CDBF;       /* 머리카락 선 */
  --lift:0 1px 0 rgba(36,33,29,.05),0 14px 34px -12px rgba(36,33,29,.30);
  --serif:"Noto Serif KR","Noto Serif CJK KR","Nanum Myeongjo","AppleMyungjo","Batang",ui-serif,serif;
  --t-xs:.6875rem; --t-s:.8125rem; --t-m:.9375rem; --t-l:1.0625rem; --t-xl:1.5rem;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#1D1C1A; --paper-2:#252321; --water:#2A2D2E; --me:#7FA7D0;
    --ink:#EEE7DC; --ink-2:#ADA59A; --ink-3:#757065; --rule:#3B3631;
    --lift:0 1px 0 rgba(0,0,0,.35),0 16px 36px -12px rgba(0,0,0,.75);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#1D1C1A; --paper-2:#252321; --water:#2A2D2E; --me:#7FA7D0;
  --ink:#EEE7DC; --ink-2:#ADA59A; --ink-3:#757065; --rule:#3B3631;
  --lift:0 1px 0 rgba(0,0,0,.35),0 16px 36px -12px rgba(0,0,0,.75);
  color-scheme:dark;
}

html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--serif);font-size:var(--t-m);line-height:1.6;overflow:hidden;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
button{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
p{margin:0}
h1,h2{margin:0}

#app{position:relative;height:100%;overflow:hidden}
#map{position:absolute;inset:0}
.leaflet-container{background:var(--water);font-family:var(--serif);outline-offset:-2px}
.maperr{position:absolute;inset:0;display:grid;place-items:center;color:var(--ink-2);padding-inline:16px;text-align:center}

/* ---------- base map (OpenStreetMap, js/basemap.js) ---------- */
.map .basemap{background:var(--paper)}
/* 내 위치 */
.lf-me-acc{fill:var(--me);fill-opacity:.12;stroke:var(--me);stroke-opacity:.35;stroke-width:1}
.lf-me{fill:var(--me);fill-opacity:1;stroke:var(--paper);stroke-width:2.5;stroke-opacity:1}
.locate{position:absolute;z-index:950;right:16px;top:calc(72px + env(safe-area-inset-top,0px));width:40px;height:40px;padding:0;display:grid;place-items:center;
  background:var(--paper);color:var(--ink-2);border:1px solid var(--rule);border-radius:2px;cursor:pointer}
.locate:hover{border-color:var(--ink-2);color:var(--ink)}
.locate svg{width:20px;height:20px;display:block}
.locate .core{fill:none}
.locate.on{color:var(--me);border-color:var(--me)}
.locate.on .core{fill:currentColor}
.locate.busy svg{animation:locate-pulse 1s ease-in-out infinite}
@keyframes locate-pulse{50%{opacity:.3}}
@media (min-width:900px){.locate{top:auto;bottom:108px;width:36px;height:36px}}
.lf-case{fill:none;stroke:var(--paper);stroke-width:7;stroke-opacity:1;stroke-linecap:round;stroke-linejoin:round}
.lf-route{fill:none;stroke:var(--ink);stroke-width:2;stroke-opacity:.7;stroke-linecap:round;stroke-linejoin:round;transition:stroke-width .15s}
.lf-route.sel{stroke-width:3.2;stroke-opacity:1}
.lf-route.gpx{stroke-dasharray:8 5;stroke-width:3;stroke-opacity:1}
.lf-start-gpx{fill:var(--ink);fill-opacity:1;stroke:var(--paper);stroke-width:2;stroke-opacity:1}
/* 멀리서 볼 때는 점, 가까이 가면 선 */
.map.zl .lf-case:not(.gpx),.map.zl .lf-route:not(.gpx),.map.zm .lf-case:not(.gpx),.map.zm .lf-route:not(.gpx){display:none}

.lbl-wrap{width:0!important;height:0!important;background:none;border:0}
.lbl{position:absolute;left:0;top:0;transform:translate(-50%,-50%);white-space:nowrap;pointer-events:none;color:var(--ink-3);font-size:.6875rem;letter-spacing:.04em;line-height:1;
  text-shadow:0 0 2px var(--paper),0 0 2px var(--paper),0 0 4px var(--paper)}
.lbl-river{font-size:.875rem;letter-spacing:1.4em;padding-left:1.4em;color:var(--ink-2);text-shadow:none}
/* 멀리서 볼 때는 걸어볼 길 이름을 숨긴다 (고르면 보인다) */
.map.zl .pin.planned:not(.sel) .pl{display:none}
/* 전국을 볼 때는 걸어본 길 점만 남긴다 */
.map.zf .pin.planned:not(.sel),.map.zf .lbl-river{display:none}
.map.zf .pin:not(.sel) .pl{display:none}

/* ---------- course pins ---------- */
.pin-wrap{width:0!important;height:0!important;background:none;border:0;outline:none}
.pin{position:absolute;left:0;top:0;cursor:pointer}

const INSTA = 'https://www.instagram.com/sun.dayphoto/';

/* ===== helpers ===== */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
const kakaoTo = (name, lat, lng) => `https://map.kakao.com/link/to/${encodeURIComponent(String(name).replace(/,/g, ' '))},${lat},${lng}`;
const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const narrowMQ = window.matchMedia('(max-width: 899px)');
const KM = (a, b) => { const R = 6371, r = Math.PI / 180, dLa = (b[0] - a[0]) * r, dLo = (b[1] - a[1]) * r;
  const h = Math.sin(dLa / 2) ** 2 + Math.cos(a[0] * r) * Math.cos(b[0] * r) * Math.sin(dLo / 2) ** 2; return 2 * R * Math.asin(Math.sqrt(h)); };
const pathKm = pts => pts.reduce((s, p, i) => i ? s + KM(pts[i - 1], p) : 0, 0);
const fmtKm = km => (km >= 10 ? km.toFixed(0) : km.toFixed(1)) + 'km';
const fmtMeta = c => [c.km != null ? fmtKm(c.km) : null, c.min ? `약 ${c.min}분` : null, c.shape].filter(Boolean).join(' · ');

let toastTimer;
function toast(msg, ms) {
  const t = $('#toast'); t.textContent = msg; t.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, ms || 2600);
}

function surfaceHTML(list) {
  if (!list || !list.length) return '';
  const label = list.map(([k, v]) => `${SURF[k]} ${v}%`).join(', ');
  return `<div class="surf"><div class="sbar" role="img" aria-label="노면 비율: ${esc(label)}">${list.map(([k, v]) => `<i class="s-${k}" style="flex:${v}"></i>`).join('')}</div>`
    + `<ul class="slegend">${list.map(([k, v]) => `<li><i class="sw s-${k}" aria-hidden="true"></i>${SURF[k]} ${v}%</li>`).join('')}</ul></div>`;
}

/* 코스 도면: 경로를 격자 위에 그린 SVG (축척 막대, 방향 표시, 출발점) */
function planSVG(c) {
  const W = 640, H = 380, P = 44, R = c.route;
  const lat0 = R[0][0] * Math.PI / 180, kx = 111320 * Math.cos(lat0), ky = 110540;
  const pts = R.map(([la, lo]) => [lo * kx, la * ky]);
  let minx = Infinity, maxx = -Infinity, miny = Infinity, maxy = -Infinity;
  for (const [x, y] of pts) { minx = Math.min(minx, x); maxx = Math.max(maxx, x); miny = Math.min(miny, y); maxy = Math.max(maxy, y); }
  const w = Math.max(maxx - minx, 30), h = Math.max(maxy - miny, 30);
  const s = Math.min((W - 2 * P) / w, (H - 2 * P) / h);
  const ox = (W - w * s) / 2, oy = (H - h * s) / 2;
  const X = x => ox + (x - minx) * s, Y = y => H - (oy + (y - miny) * s);
  const sp = pts.map(([x, y]) => [X(x), Y(y)]);
  const d = 'M' + sp.map(p => p[0].toFixed(1) + ',' + p[1].toFixed(1)).join('L');

  const span = Math.max(w, h);
  const grid = [50, 100, 200, 250, 500, 1000, 2000, 5000].find(g => span / g <= 6) || 10000;
  const gp = grid * s;
  const [sx, sy] = sp[0];
  let g = '';
  for (let x = sx % gp; x <= W; x += gp) g += `M${x.toFixed(1)},0V${H}`;
  for (let y = sy % gp; y <= H; y += gp) g += `M0,${y.toFixed(1)}H${W}`;

  // direction chevrons at 25 / 50 / 75 % of the length
  const seg = []; let tot = 0;
  for (let i = 1; i < sp.length; i++) { const l = Math.hypot(sp[i][0] - sp[i - 1][0], sp[i][1] - sp[i - 1][1]); seg.push(l); tot += l; }
  let chev = '';
  for (const f of [0.25, 0.5, 0.75]) {
    let t = f * tot, i = 0;
    while (i < seg.length - 1 && t > seg[i]) { t -= seg[i]; i++; }
    const a = sp[i], b = sp[i + 1], k = seg[i] ? t / seg[i] : 0;
    const px = a[0] + (b[0] - a[0]) * k, py = a[1] + (b[1] - a[1]) * k;
    const ang = Math.atan2(b[1] - a[1], b[0] - a[0]) * 180 / Math.PI;
    chev += `<path class="pl-chev" d="M-4,-4.5L2.5,0L-4,4.5" transform="translate(${px.toFixed(1)},${py.toFixed(1)}) rotate(${ang.toFixed(1)})"/>`;
  }

  // loop orientation (world coords, y north): + = counter-clockwise
  let area = 0;
  for (let i = 0; i < pts.length - 1; i++) area += pts[i][0] * pts[i + 1][1] - pts[i + 1][0] * pts[i][1];
  const loop = KM(R[0], R[R.length - 1]) < 0.06;
  const [ex, ey] = sp[sp.length - 1];
  const sb = `<path class="pl-scale" d="M${P},${H - 18}h${gp.toFixed(1)}M${P},${H - 23}v10M${(P + gp).toFixed(1)},${H - 23}v10"/>`
    + `<text class="pl-txt" x="${(P + gp + 8).toFixed(1)}" y="${H - 14}">${grid >= 1000 ? grid / 1000 + 'km' : grid + 'm'}</text>`;
  const north = `<path class="pl-scale" d="M${W - 30},${P + 6}V${P - 22}M${W - 35},${P - 15}L${W - 30},${P - 23}L${W - 25},${P - 15}"/>`
    + `<text class="pl-txt" x="${W - 30}" y="${P + 22}" text-anchor="middle">N</text>`;
  const startLabelBelow = sy < H - 40;
  const svg = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="코스 도면: ${esc(c.name)}">`
    + `<path class="pl-grid" d="${g}"/>`
    + `<path class="pl-route" d="${d}"/>${chev}`
    + (loop ? '' : `<circle class="pl-end" cx="${ex.toFixed(1)}" cy="${ey.toFixed(1)}" r="5"/><text class="pl-txt" x="${(ex + 10).toFixed(1)}" y="${(ey + 4).toFixed(1)}">도착</text>`)
    + `<circle class="pl-start" cx="${sx.toFixed(1)}" cy="${sy.toFixed(1)}" r="6"/>`
    + `<text class="pl-txt" x="${sx.toFixed(1)}" y="${(startLabelBelow ? sy + 24 : sy - 14).toFixed(1)}" text-anchor="middle">출발</text>`
    + sb + north + `</svg>`;
  const dir = loop ? `출발점에서 ${area > 0 ? '시계 반대 방향' : '시계 방향'}으로 한 바퀴` : '출발점 ● 에서 도착점 ○ 까지';
  return { svg, caption: `코스 도면 · ${dir} · 격자 한 칸 ${grid >= 1000 ? grid / 1000 + 'km' : grid + 'm'}` };
}

function detailHTML(c) {
  const row = (k, v, html) => `<div><dt>${k}</dt><dd${v == null && !html ? ' class="todo"' : ''}>${html ?? (v == null ? '답사 때 기록' : esc(v))}</dd></div>`;
  const plan = planSVG(c);
  const startLL = c.start ? [c.start.lat, c.start.lng] : c.route[0];
  return `
  <div class="page-bar">
    <button class="back" data-act="close">← 지도</button>
    <span class="page-bar-title">${esc(c.name)}</span>
  </div>
  <article class="sheet">
    ${c.sample ? `<p class="sample-note">시안 · ${esc(c.sample)}</p>` : ''}
    <header class="sheet-head">
      <p class="kicker">${c.preview ? '불러온 GPX · 코스 페이지 미리보기' : '걸어본 길'} · ${esc(c.area || '지역 미정')}</p>
      <h1 tabindex="-1">${esc(c.name)}</h1>
      <p class="meta">${esc(fmtMeta(c))}</p>
      <p class="byline">${c.dogs ? esc(c.dogs) : '함께 걸은 개 —'} · ${c.walked ? esc(c.walked) + ' 답사' : '답사일 미정'}</p>
      ${c.start ? `<p class="start"><span class="lab">출발점</span><span id="start-name">${esc(c.start.name)}</span><button class="copy" data-act="copy">이름 복사</button></p>` : ''}
    </header>

    <figure class="slot slot-hero"><figcaption>대표 사진 자리 · 3:2</figcaption></figure>

    <section>
      <h2 class="sec">길 정보</h2>
      <dl class="spec">
        ${row('노면', null, c.surface && c.surface.length ? surfaceHTML(c.surface) : null)}
        ${row('폭', c.width)}
        ${row('그늘', c.shade)}
        ${row('붐빔', c.crowd)}
        ${row('자전거', c.bike)}
        ${row('주차', c.parking)}
        ${row('편의', c.amenity)}
      </dl>
    </section>

    <figure class="plan">${plan.svg}<figcaption>${esc(plan.caption)}</figcaption></figure>

    <div class="row-actions">
      <a class="btn" href="${kakaoTo(c.start ? c.start.name : c.name, startLL[0], startLL[1])}" target="_blank" rel="noopener">출발점 길 안내 ↗</a>
      <button class="btn" data-act="map">지도에서 보기</button>
    </div>

    <section class="note">
      <h2 class="sec">걸은 기록</h2>
      <p class="todo">산책 기록이 들어갈 자리입니다. 개들이 오래 머문 곳, 계절마다 달라지는 점, 다시 걷는다면 고를 시간대를 적습니다.</p>
    </section>

    <section>
      <h2 class="sec">이 길에서 찍은 사진</h2>
      <div class="shots">
        <figure class="slot"><figcaption>사진 자리 · 4:5</figcaption></figure>
        <figure class="slot"><figcaption>사진 자리 · 4:5</figcaption></figure>
        <figure class="slot"><figcaption>사진 자리 · 4:5</figcaption></figure>
      </div>
      <p class="shots-cap">이 길에서 찍은 산책 스냅이 쌓이면 여기에 놓입니다.</p>
    </section>

    <aside class="cta">
      <p class="cta-k">일,요산책</p>
      <p class="cta-t">이 길에서 찍어 드립니다.</p>
      <p class="cta-s">포즈 없이, 평소처럼 걷는 모습을 찍습니다.</p>
      <a class="btn solid" href="${INSTA}" target="_blank" rel="noopener">예약·문의 ↗</a>
    </aside>

    <footer class="foot">
      <p>모든 길은 목줄 2m 안에서 걸었습니다.</p>
      <p>길이 바뀌었으면 알려 주세요. <a href="${INSTA}" target="_blank" rel="noopener">@sun.dayphoto ↗</a></p>
    </footer>
  </article>`;
}

/* ===== map ===== */
function start() {
  const app = $('#app'), card = $('#card'), list = $('#list'), detail = $('#detail');
  const map = L.map('map', {
    zoomControl: false, minZoom: 6, maxZoom: 16, zoomSnap: 1,
    maxBounds: L.latLngBounds(GEO.bounds).pad(0.02), maxBoundsViscosity: 0.85
  });
  map.attributionControl.setPrefix('<a href="https://leafletjs.com" target="_blank" rel="noopener">Leaflet</a>');
  L.control.zoom({ position: 'bottomright', zoomInTitle: '확대', zoomOutTitle: '축소' }).addTo(map);
  [['basePane', 200], ['routePane', 400], ['labelPane', 450]].forEach(([n, z]) => {
    const p = map.createPane(n); p.style.zIndex = z; if (n === 'labelPane') p.style.pointerEvents = 'none';
  });

  // 바탕 지도: OpenStreetMap (js/basemap.js). 휴대폰 화면 색 설정이 바뀌면 다시 그린다.
  let base = null;
  const drawBase = () => {
    if (!window.makeBasemap) return;
    if (base) map.removeLayer(base);
    base = window.makeBasemap({ pane: 'basePane' }).addTo(map);
  };
  drawBase();
  if (window.makeBasemap) window.makeBasemap.onThemeChange(drawBase);

  const label = (ll, text, cls, rot) => L.marker(ll, {
    pane: 'labelPane', interactive: false, keyboard: false,
    icon: L.divIcon({ className: 'lbl-wrap', iconSize: null, html: `<span class="lbl ${cls}"${rot != null ? ` style="transform:translate(-50%,-50%) rotate(${rot}deg)"` : ''}>${esc(text)}</span>` })
  }).addTo(map);
  GEO.riverLabels.forEach(r => label(r.l, r.n, 'lbl-river', r.r));

  const zoomClass = () => {
    const z = map.getZoom(), el = map.getContainer();
    el.classList.toggle('zf', z <= 9); el.classList.toggle('zl', z <= 11); el.classList.toggle('zm', z === 12);
    el.classList.toggle('zh', z === 13); el.classList.toggle('zx', z >= 14);
  };
  map.on('zoomend', zoomClass);

  // 코스
  const layers = {};
  COURSES.forEach(c => {
    const at = c.status === 'walked' ? [c.start.lat, c.start.lng] : c.at;
    const m = L.marker(at, {
      title: c.name, keyboard: true, riseOnHover: true,
      icon: L.divIcon({ className: 'pin-wrap', iconSize: [0, 0], html: `<div class="pin ${c.status}"><i class="dot"></i><span class="pl ${c.label}">${esc(c.name)}</span></div>` })
    }).addTo(map);
    m.on('click', () => select(c.id, true));
    const entry = { c, m };
    if (c.route) {
      entry.cs = L.polyline(c.route, { pane: 'routePane', className: 'lf-case', interactive: false }).addTo(map);
      entry.ln = L.polyline(c.route, { pane: 'routePane', className: 'lf-route' }).addTo(map);
      entry.ln.on('click', () => select(c.id, true));
    }
    layers[c.id] = entry;
  });
  $('#n-walked').textContent = COURSES.filter(c => c.status === 'walked').length;
  $('#n-planned').textContent = COURSES.filter(c => c.status === 'planned').length;

  const pad = () => {
    const top = 80;
    if (narrowMQ.matches) return { paddingTopLeft: [28, top], paddingBottomRight: [28, (card.hidden ? 150 : card.offsetHeight + 28)] };
    return { paddingTopLeft: [(list.hidden ? 40 : 400), top], paddingBottomRight: [(card.hidden ? 40 : 400), 40] };
  };

  let selected = null, gpx = null;
  function markSelected() {
    Object.values(layers).forEach(({ c, m, ln }) => {
      const el = m.getElement(); el && el.querySelector('.pin').classList.toggle('sel', c.id === selected);
      if (ln && ln.getElement()) ln.getElement().classList.toggle('sel', c.id === selected);
    });
  }
  function select(id, fly) {
    clearGPX();
    selected = id; markSelected(); renderCard(layers[id].c);
    if (fly) focusOn(id);
  }
  function deselect() { selected = null; markSelected(); card.hidden = true; }
  function focusOn(id) {
    const { c } = layers[id];
    const b = c.route ? L.latLngBounds(c.route) : L.latLng(c.at).toBounds(2400);
    map.flyToBounds(b, { ...pad(), maxZoom: c.route ? 15 : 13, animate: !reduceMotion, duration: 0.7 });
  }

  function renderCard(c) {
    let html = `<button class="x" data-act="deselect" aria-label="닫기">×</button>`;
    if (c.status === 'walked') {
      html += `<p class="kicker">걸어본 길 · ${esc(c.short)}</p>
        <h2 class="card-title">${esc(c.name)}</h2>
        <p class="meta">${esc(fmtMeta(c))}</p>
        ${surfaceHTML(c.surface)}
        <p class="one">${esc(c.oneLine)}</p>
        <div class="actions">
          <a class="btn" href="${kakaoTo(c.start.name, c.start.lat, c.start.lng)}" target="_blank" rel="noopener">길 안내 ↗</a>
          <button class="btn solid" data-act="detail" data-id="${c.id}">자세히 보기</button>
        </div>`;
    } else {
      html += `<p class="kicker">걸어볼 길 · ${esc(c.short)}</p>
        <h2 class="card-title">${esc(c.name)}</h2>
        <p class="one muted">아직 걷지 않았습니다. 걸어 보면 노면, 폭, 붐비는 시간을 채워 둡니다.</p>
        <div class="actions">
          <a class="btn" href="${kakaoTo(c.name, c.at[0], c.at[1])}" target="_blank" rel="noopener">길 안내 ↗</a>
          <a class="btn solid" href="${INSTA}" target="_blank" rel="noopener">먼저 걸어 주세요 ↗</a>
        </div>`;
    }
    card.innerHTML = html; card.hidden = false;
  }

  // 코스 페이지
  let lastFocus = null, current = null;
  function openDetail(c, opener) {
    current = c; lastFocus = opener || document.activeElement;
    detail.innerHTML = detailHTML(c); detail.hidden = false; detail.scrollTop = 0;
    if (!c.preview) { try { history.replaceState(null, '', '#' + c.id); } catch (e) {} }
    const h = detail.querySelector('h1'); h && h.focus({ preventScroll: true });
  }
  function closeDetail() {
    detail.hidden = true;
    try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {}
    if (lastFocus && document.contains(lastFocus)) lastFocus.focus();
  }
  detail.addEventListener('click', e => {
    const a = e.target.closest('[data-act]'); if (!a) return;
    const act = a.dataset.act;
    if (act === 'close') closeDetail();
    if (act === 'map') { closeDetail(); if (current && current.preview) showGPXOnMap(); else if (current) select(current.id, true); }
    if (act === 'copy') {
      const text = current && current.start ? current.start.name : '';
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(() => toast('출발점 이름을 복사했습니다.'), () => selectText('#start-name'));
      } else selectText('#start-name');
    }
  });
  function selectText(sel) {
    const el = $(sel); if (!el) return;
    const r = document.createRange(); r.selectNodeContents(el);
    const s = window.getSelection(); s.removeAllRanges(); s.addRange(r);
    toast('복사가 막혀 있어 글자를 선택해 두었습니다.');
  }

  card.addEventListener('click', e => {
    const a = e.target.closest('[data-act]'); if (!a) return;
    if (a.dataset.act === 'deselect') { if (gpx) clearGPX(); deselect(); }
    if (a.dataset.act === 'detail') openDetail(layers[a.dataset.id].c, a);
    if (a.dataset.act === 'gpx-page') openDetail(gpx.course, a);
    if (a.dataset.act === 'gpx-clear') { clearGPX(); card.hidden = true; }
  });
  map.on('click', () => { if (!gpx) deselect(); });

  // 목록
  function renderList() {
    const item = c => `<li><button class="item" data-id="${c.id}"><i class="${c.status === 'walked' ? 'g-walked' : 'g-planned'}" aria-hidden="true"></i>`
      + `<span class="nm">${esc(c.name)}</span><span class="km">${c.km != null ? fmtKm(c.km) : '—'}</span><span class="ar">${esc(c.area)}</span></button></li>`;
    const w = COURSES.filter(c => c.status === 'walked'), p = COURSES.filter(c => c.status === 'planned');
    $('#list-body').innerHTML = `<p class="grp"><span>걸어본 길</span><span>${w.length}</span></p><ul>${w.map(item).join('')}</ul>`
      + `<p class="grp"><span>걸어볼 길</span><span>${p.length}</span></p><ul>${p.map(item).join('')}</ul>`;
  }
  renderList();
  const btnList = $('#btn-list');
  const setList = open => { list.hidden = !open; btnList.setAttribute('aria-expanded', String(open)); };
  btnList.addEventListener('click', () => setList(list.hidden));
  $('#list-close').addEventListener('click', () => { setList(false); btnList.focus(); });
  $('#list-body').addEventListener('click', e => {
    const b = e.target.closest('.item'); if (!b) return;
    if (narrowMQ.matches) setList(false);
    select(b.dataset.id, true);
  });

  // GPX
  function clearGPX() {
    if (!gpx) return;
    gpx.layers.forEach(l => map.removeLayer(l)); gpx = null;
    map.setMaxBounds(L.latLngBounds(GEO.bounds).pad(0.02));
  }
  function showGPXOnMap() {
    if (!gpx) return;
    const b = L.latLngBounds(gpx.course.route);
    map.flyToBounds(b, { ...pad(), maxZoom: 15, animate: !reduceMotion, duration: 0.7 });
  }
  function parseGPX(text) {
    const doc = new DOMParser().parseFromString(text, 'application/xml');
    if (doc.getElementsByTagName('parsererror').length) throw new Error('GPX 형식을 읽지 못했습니다. 파일이 깨지지 않았는지 확인해 주세요.');
    let nodes = [...doc.getElementsByTagNameNS('*', 'trkpt')];
    if (!nodes.length) nodes = [...doc.getElementsByTagNameNS('*', 'rtept')];
    const pts = nodes.map(n => [parseFloat(n.getAttribute('lat')), parseFloat(n.getAttribute('lon'))]).filter(([a, b]) => isFinite(a) && isFinite(b));
    if (pts.length < 2) throw new Error('GPX에서 경로 점을 찾지 못했습니다. 트랙이 들어 있는 파일인지 확인해 주세요.');
    const times = nodes.map(n => { const t = n.getElementsByTagNameNS('*', 'time')[0]; return t ? Date.parse(t.textContent) : NaN; }).filter(isFinite);
    const minutes = times.length > 1 ? Math.round((times[times.length - 1] - times[0]) / 60000) : null;
    const nm = doc.getElementsByTagNameNS('*', 'name')[0];
    return { pts, minutes, name: nm ? nm.textContent.trim() : '' };
  }
  function showGPX(res, fileName) {
    clearGPX(); deselect();
    const km = pathKm(res.pts);
    const loop = KM(res.pts[0], res.pts[res.pts.length - 1]) < 0.06;
    const inside = L.latLngBounds(GEO.bounds).contains(L.latLngBounds(res.pts));
    const course = {
      id: 'gpx', status: 'walked', preview: true,
      name: res.name || fileName.replace(/\.gpx$/i, ''), area: inside ? null : '지도 범위 밖',
      km: Math.round(km * 10) / 10, min: res.minutes, shape: loop ? '한 바퀴' : '편도',
      surface: null, width: null, shade: null, crowd: null, bike: null, parking: null, amenity: null,
      route: res.pts, start: { name: '출발점 이름 미정', lat: res.pts[0][0], lng: res.pts[0][1] }
    };
    const ls = [
      L.polyline(res.pts, { pane: 'routePane', className: 'lf-case gpx', interactive: false }),
      L.polyline(res.pts, { pane: 'routePane', className: 'lf-route gpx', interactive: false }),
      L.circleMarker(res.pts[0], { pane: 'routePane', radius: 6, className: 'lf-start-gpx', interactive: false })
    ];
    if (!inside) map.setMaxBounds(null);
    ls.forEach(l => l.addTo(map));
    gpx = { layers: ls, course };
    card.innerHTML = `<button class="x" data-act="deselect" aria-label="닫기">×</button>
      <p class="kicker">불러온 GPX · 미리보기</p>
      <h2 class="card-title">${esc(course.name)}</h2>
      <p class="meta">${esc(fmtMeta(course))} · 점 ${res.pts.length.toLocaleString('ko-KR')}개</p>
      <p class="one muted">이 화면에서만 보이고 저장되지 않습니다.${inside ? '' : ' 지도 범위(한국) 밖의 길이라 바탕 지도가 비어 보입니다.'}</p>
      <div class="actions">
        <button class="btn" data-act="gpx-clear">지우기</button>
        <button class="btn solid" data-act="gpx-page">코스 페이지로 보기</button>
      </div>`;
    card.hidden = false;
    showGPXOnMap();
  }
  function readGPX(file) {
    if (!/\.gpx$/i.test(file.name) && !/gpx/.test(file.type)) { toast('GPX 파일만 불러올 수 있습니다.'); return; }
    const r = new FileReader();
    r.onload = () => { try { showGPX(parseGPX(String(r.result)), file.name); } catch (err) { toast(err.message || 'GPX를 읽지 못했습니다.'); } };
    r.onerror = () => toast('파일을 읽지 못했습니다. 다시 골라 주세요.');
    r.readAsText(file);
  }
  const input = $('#gpx-input');
  $('#btn-gpx').addEventListener('click', () => input.click());
  input.addEventListener('change', () => { const f = input.files && input.files[0]; if (f) readGPX(f); input.value = ''; });
  const drop = $('#drop'); let depth = 0;
  const hasFiles = e => e.dataTransfer && [...e.dataTransfer.types].includes('Files');
  app.addEventListener('dragenter', e => { if (!hasFiles(e)) return; e.preventDefault(); depth++; drop.hidden = false; });
  app.addEventListener('dragover', e => { if (hasFiles(e)) e.preventDefault(); });
  app.addEventListener('dragleave', e => { if (!hasFiles(e)) return; depth = Math.max(0, depth - 1); if (!depth) drop.hidden = true; });
  app.addEventListener('drop', e => { if (!hasFiles(e)) return; e.preventDefault(); depth = 0; drop.hidden = true; const f = e.dataTransfer.files[0]; if (f) readGPX(f); });

  // 내 위치: 이 화면 안에서만 쓰고 어디에도 보내거나 저장하지 않는다
  const btnLoc = $('#btn-locate');
  let me = null, watchId = null, wantLoc = false;
  const setLoc = s => {
    btnLoc.classList.toggle('busy', s === 'busy'); btnLoc.classList.toggle('on', s === 'on');
    btnLoc.setAttribute('aria-pressed', String(s === 'on'));
  };
  const goMe = () => {
    if (!me) return;
    map.flyToBounds(L.latLng(me.ll).toBounds(Math.max(350, me.m * 2.5)), { ...pad(), maxZoom: 16, animate: !reduceMotion, duration: 0.7 });
  };
  const stopWatch = () => { if (watchId != null) { navigator.geolocation.clearWatch(watchId); watchId = null; } };
  const startWatch = announce => {
    let first = true;
    watchId = navigator.geolocation.watchPosition(pos => {
      const ll = [pos.coords.latitude, pos.coords.longitude], m = Math.min(pos.coords.accuracy || 30, 1000);
      if (!me) {
        me = {
          ring: L.circle(ll, { radius: m, pane: 'routePane', className: 'lf-me-acc', interactive: false }).addTo(map),
          dot: L.circleMarker(ll, { radius: 7, pane: 'routePane', className: 'lf-me', interactive: false }).addTo(map)
        };
      } else { me.ring.setLatLng(ll).setRadius(m); me.dot.setLatLng(ll); }
      me.ll = ll; me.m = m;
      setLoc('on');
      if (first && announce) {
        if (L.latLngBounds(GEO.bounds).contains(ll)) { goMe(); toast('위치는 이 화면에서만 쓰고 저장하지 않아요.'); }
        else {
          toast('지금 계신 곳은 지도 범위(한국) 밖이에요.');
          stopWatch(); wantLoc = false; setLoc('');
          map.removeLayer(me.ring); map.removeLayer(me.dot); me = null;
          return;
        }
      }
      first = false;
    }, err => {
      if (me) return; // 한 번 찾은 뒤 잠깐 놓친 건 넘어간다
      stopWatch(); wantLoc = false; setLoc('');
      toast(err.code === 1 ? '위치 권한이 꺼져 있어요. 브라우저 설정에서 이 사이트의 위치 사용을 허용해 주세요.' : '지금 위치를 찾지 못했어요. 잠시 뒤 다시 눌러 주세요.', 4500);
    }, { enableHighAccuracy: true, maximumAge: 10000, timeout: 20000 });
  };
  btnLoc.addEventListener('click', () => {
    if (!('geolocation' in navigator)) { toast('이 브라우저에서는 위치를 쓸 수 없어요.'); return; }
    if (me && watchId != null) { goMe(); return; }
    wantLoc = true; setLoc('busy'); startWatch(true);
  });
  // 화면을 떠나면 위치 찾기를 멈추고, 돌아오면 다시 켠다 (배터리)
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) stopWatch();
    else if (wantLoc && watchId == null) startWatch(false);
  });

  // 키보드
  document.addEventListener('keydown', e => {
    if (e.key !== 'Escape') return;
    if (!detail.hidden) closeDetail();
    else if (!list.hidden) { setList(false); btnList.focus(); }
    else if (!card.hidden) { if (gpx) clearGPX(); deselect(); }
  });

  // 첫 화면: 전체 코스가 보이게 맞추고, 걸어본 길 하나를 열어 둔다
  const first = COURSES.find(c => c.status === 'walked');
  if (first) { selected = first.id; renderCard(first); }
  const all = L.latLngBounds(COURSES.flatMap(c => c.route ? c.route : [c.at]));
  map.fitBounds(all, { ...pad(), animate: false });
  zoomClass(); markSelected();

  const fromHash = () => {
    const id = decodeURIComponent((location.hash || '').slice(1));
    const hit = COURSES.find(c => c.id === id && c.status === 'walked');
    if (hit) { select(hit.id, false); openDetail(hit); }
  };
  fromHash();
  window.addEventListener('hashchange', fromHash);
}

(function boot() {
  if (window.L) return start();
  $('#map').innerHTML = '<p class="maperr">지도를 불러오지 못했습니다. 잠시 뒤 새로고침해 주세요.</p>';
})();
</script>
</body>
</html>
